<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal de Orçamentos – WildnerDesign</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0e0e;--panel:#161616;--card:#1c1c1c;--card2:#222;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --txt:#f0f0f0;--muted:rgba(255,255,255,0.4);--muted2:rgba(255,255,255,0.22);
  --white:#fff;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column}

/* ── TOPBAR ── */
.topbar{background:var(--panel);border-bottom:1px solid var(--border);padding:0 2rem;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar img{height:26px;width:auto;cursor:pointer}
.topbar-right{display:flex;align-items:center;gap:10px}
.page-tag{font-size:11px;color:var(--muted);letter-spacing:.05em;border-left:1px solid var(--border2);padding-left:12px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:7px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:9px 20px;border-radius:7px;border:none;cursor:pointer;transition:all .18s;text-decoration:none}
.btn-primary{background:#fff;color:#111}.btn-primary:hover{background:#e0e0e0}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border2)}.btn-ghost:hover{background:var(--card);color:var(--white)}
.btn-email{background:transparent;color:#ccc;border:1px solid #555}.btn-email:hover{background:rgba(255,255,255,.07);color:#fff}
.btn-danger{background:transparent;color:#e07070;border:1px solid rgba(220,80,80,0.3)}.btn-danger:hover{background:rgba(220,80,80,.1)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:disabled{opacity:.5;pointer-events:none}

/* ── PAGES ── */
.page{display:none;flex-direction:column;flex:1}
.page.active{display:flex}

/* ══════════ DASHBOARD ══════════ */
.dash-content{flex:1;padding:2rem 2.5rem;max-width:1400px;width:100%;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:2rem}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.25rem 1.5rem}
.stat-label{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.stat-value{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:700;color:var(--white);line-height:1}
.stat-sub{font-size:11px;color:var(--muted2);margin-top:5px}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem}
.search-wrap{flex:1;position:relative}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.search-wrap input{width:100%;background:var(--card);border:1px solid var(--border2);border-radius:7px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 12px 9px 36px;outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:rgba(255,255,255,.35)}
.search-wrap input::placeholder{color:var(--muted2)}
.filter-btns{display:flex;gap:6px}
.filter-btn{background:transparent;border:1px solid var(--border2);border-radius:6px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;padding:7px 14px;cursor:pointer;transition:all .15s}
.filter-btn.active,.filter-btn:hover{background:var(--card2);border-color:rgba(255,255,255,.3);color:var(--white)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.orc-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.25rem 1.4rem;transition:border-color .18s,background .18s}
.orc-card:hover{border-color:var(--border2);background:var(--card2)}
.orc-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem}
.orc-num{font-size:11px;color:var(--muted);letter-spacing:.08em}
.status-badge{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:4px}
.s-rascunho{background:rgba(255,255,255,.07);color:rgba(255,255,255,.45)}
.s-enviado{background:rgba(100,160,255,.12);color:#78aaff}
.s-aprovado{background:rgba(80,200,130,.12);color:#5ec98a}
.s-recusado{background:rgba(220,80,80,.12);color:#e07070}
.orc-cliente{font-size:1rem;font-weight:600;color:var(--white);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orc-servico{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1rem}
.orc-footer{display:flex;justify-content:space-between;align-items:center;padding-top:.85rem;border-top:1px solid var(--border)}
.orc-valor{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:var(--white)}
.orc-data{font-size:11px;color:var(--muted2)}
.orc-actions{display:flex;gap:6px;margin-top:.85rem}
.orc-btn{flex:1;background:transparent;border:1px solid var(--border2);border-radius:6px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11px;padding:6px 0;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.orc-btn:hover{background:rgba(255,255,255,.06);color:var(--white)}
.orc-btn.danger:hover{background:rgba(220,80,80,.12);border-color:rgba(220,80,80,.3);color:#e07070}
.orc-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.status-select{background:transparent;border:none;color:inherit;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;outline:none;padding:3px 9px;border-radius:4px}
.empty{grid-column:1/-1;text-align:center;padding:5rem 2rem;color:var(--muted)}
.empty svg{width:48px;height:48px;stroke:var(--muted2);fill:none;stroke-width:1.5;margin-bottom:1rem;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 1rem}
.empty p{font-size:14px;margin-bottom:1.5rem}

/* ══════════ EDITOR ══════════ */
.editor-wrap{display:flex;flex:1;overflow:hidden;height:calc(100vh - 60px)}
.form-panel{width:390px;min-width:350px;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0}
.form-panel::-webkit-scrollbar{width:4px}.form-panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.fsec{padding:1.4rem 1.5rem;border-bottom:1px solid var(--border)}
.fsec-label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.fsec-label::after{content:'';flex:1;height:1px;background:var(--border)}
.field{margin-bottom:11px}.field:last-child{margin-bottom:0}
.field label{display:block;font-size:11px;color:var(--muted2);margin-bottom:4px;font-weight:500}
.field input,.field textarea,.field select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border2);border-radius:6px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 11px;outline:none;transition:border-color .15s;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(255,255,255,.4)}
.field input::placeholder,.field textarea::placeholder{color:var(--muted2)}
.field select option{background:#222}
.frow{display:flex;gap:10px}.frow .field{flex:1;margin-bottom:0}
.bullets-list{display:flex;flex-direction:column;gap:7px;margin-bottom:8px}
.bullet-item{display:flex;align-items:flex-start;gap:8px;background:rgba(255,255,255,.04);border:1px solid var(--border2);border-radius:6px;padding:8px 10px}
.bullet-dot{color:#888;flex-shrink:0}
.bullet-item input{flex:1;background:none;border:none;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:12px;outline:none;padding:0}
.bullet-item input::placeholder{color:var(--muted2)}
.btn-rm{background:none;border:none;cursor:pointer;color:var(--muted2);font-size:16px;line-height:1;padding:0 2px;transition:color .15s;flex-shrink:0}
.btn-rm:hover{color:#e24b4a}
.btn-add{width:100%;background:none;border:1px dashed rgba(255,255,255,.12);border-radius:6px;color:var(--muted2);font-size:12px;padding:8px;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif}
.btn-add:hover{border-color:#aaa;color:#ccc}
.preview-panel{flex:1;background:#6b6b6b;overflow-y:auto;display:flex;justify-content:center;padding:2rem}
.preview-panel::-webkit-scrollbar{width:6px}.preview-panel::-webkit-scrollbar-track{background:#5a5a5a}.preview-panel::-webkit-scrollbar-thumb{background:#999;border-radius:3px}

/* ══════════ DOCUMENT ══════════ */
.doc{background:#fff;width:794px;min-height:1123px;box-shadow:0 8px 48px rgba(0,0,0,.5);color:#111;font-family:'DM Sans',sans-serif}
.doc-cover{background:#0e0e0e;min-height:380px;padding:3rem 3.5rem 2.5rem;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.doc-cover::before{content:'';position:absolute;top:-60px;right:-60px;width:300px;height:300px;border-radius:50%;border:1px solid rgba(200,200,200,.1)}
.doc-cover::after{content:'';position:absolute;bottom:-80px;left:-40px;width:250px;height:250px;border-radius:50%;border:1px solid rgba(200,200,200,.06)}
.cover-top{display:flex;justify-content:space-between;align-items:flex-start}
.cover-meta{text-align:right;font-size:11px;color:rgba(255,255,255,.4);line-height:1.8}
.cover-meta strong{color:rgba(255,255,255,.7);font-weight:500}
.cover-contact{font-size:10px;color:rgba(255,255,255,.28);line-height:1.9;margin-top:6px}
.cover-bottom{position:relative;z-index:1}
.cover-tag{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#aaa;margin-bottom:.4rem;font-weight:500}
.cover-title{font-family:'Playfair Display',serif;font-size:2.8rem;font-weight:700;color:#fff;line-height:1.1;margin-bottom:1rem}
.cover-client-block{display:flex;gap:2.5rem;padding-top:1.4rem;border-top:1px solid rgba(255,255,255,.1)}
.cover-client-item label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.3);display:block;margin-bottom:3px}
.cover-client-item span{font-size:13px;font-weight:500;color:rgba(255,255,255,.85)}
.doc-body{padding:0 3.5rem 3.5rem}
.doc-section{padding:1.75rem 0;border-bottom:1px solid #e8e4da}
.doc-section:last-child{border-bottom:none}
.doc-sec-header{display:flex;align-items:baseline;gap:1rem;margin-bottom:1.25rem}
.doc-sec-num{font-family:'Playfair Display',serif;font-size:2.8rem;font-weight:700;color:#ececec;line-height:1;flex-shrink:0}
.doc-sec-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#999;font-weight:600}
.doc-sub-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#bbb;font-weight:600;margin-bottom:.7rem}
.doc-proj-title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:600;color:#111;margin-bottom:.9rem}
.doc-bullets{list-style:none}
.doc-bullets li{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.6;color:#333;padding:5px 0;border-bottom:1px solid #f5f5f5}
.doc-bullets li::before{content:'•';color:#888;font-size:16px;margin-top:-1px;flex-shrink:0}
.price-row{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.25rem;background:#f9f8f5;border:1px solid #e8e4da;border-radius:8px}
.price-label{font-size:13px;color:#555}
.price-val{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;color:#111}
.prazo-badge{display:inline-flex;align-items:center;gap:8px;background:#f0f0ec;border:1px solid #ddd;border-radius:6px;padding:10px 18px;font-size:14px;color:#333}
.prazo-badge strong{font-family:'Playfair Display',serif;font-size:1.4rem;color:#111}
.payment-method{font-size:14px;font-weight:600;color:#111;margin-bottom:.25rem}
.payment-obs{font-size:12px;color:#888;margin-bottom:1rem}
.pix-box{border:1px solid #ddd;border-radius:8px;padding:1rem 1.25rem;background:#f9f8f5;font-size:12px;color:#555;line-height:1.8}
.pix-box strong{color:#111;display:block;margin-bottom:4px;font-size:13px}
.approval-box{display:flex;gap:3rem;padding-top:1.5rem}
.approval-party{flex:1}
.approval-role{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#bbb;margin-bottom:1.5rem;font-weight:600}
.approval-field{font-size:12px;color:#444;padding-bottom:.5rem;border-bottom:1px solid #ddd;margin-bottom:.5rem}
.approval-field label{font-size:10px;color:#aaa;display:block;margin-bottom:2px}

/* ══════════ VIEW ══════════ */
.view-wrap{flex:1;background:#6b6b6b;overflow-y:auto;display:flex;justify-content:center;padding:2rem}
.view-wrap::-webkit-scrollbar{width:6px}.view-wrap::-webkit-scrollbar-track{background:#5a5a5a}.view-wrap::-webkit-scrollbar-thumb{background:#999;border-radius:3px}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:#1e1e1e;border:1px solid var(--border2);border-radius:12px;padding:2rem;width:360px;text-align:center}
.modal h3{font-size:1rem;margin-bottom:.6rem;color:var(--white)}
.modal p{font-size:13px;color:var(--muted);margin-bottom:1.5rem}
.modal-btns{display:flex;gap:10px}.modal-btns button{flex:1}

/* ── TOAST ── */
.toast{position:fixed;bottom:2rem;right:2rem;background:#222;border:1px solid var(--border2);border-radius:8px;padding:12px 20px;font-size:13px;color:var(--white);z-index:500;transform:translateY(20px);opacity:0;transition:all .25s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
.toast.ok{border-color:rgba(80,200,130,.4);color:#5ec98a}

@media print{
  -webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;
  body{background:white}
  .topbar,.form-panel{display:none!important}
  .editor-wrap,.view-wrap{height:auto;display:block;overflow:visible}
  .preview-panel,.view-wrap{background:white!important;padding:0;display:block;overflow:visible}
  .doc{box-shadow:none;width:100%}
  .doc-cover{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;background:#0e0e0e!important}
  .doc-section{page-break-inside:avoid}
}
</style>
</head>

// ══ IndexedDB ════════════════════════════════════════════════════════════════
let idb;
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('wildner_orcamentos', 2);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('orcamentos')) {
        const store = db.createObjectStore('orcamentos', {keyPath:'id', autoIncrement:true});
        store.createIndex('status','status');
      }
      if (!db.objectStoreNames.contains('meta')) {
        db.createObjectStore('meta', {keyPath:'key'});
      }
    };
    req.onsuccess = e => { idb = e.target.result; res(idb); };
    req.onerror   = () => rej(req.error);
  });
}
function tx(store, mode='readonly') { return idb.transaction(store, mode).objectStore(store); }
function all(store) { return new Promise((res,rej)=>{ const r=tx(store).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function get(store,key) { return new Promise((res,rej)=>{ const r=tx(store).get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function put(store,val,mode='readwrite') { return new Promise((res,rej)=>{ const r=tx(store,mode).put(val); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function del(store,key) { return new Promise((res,rej)=>{ const r=tx(store,'readwrite').delete(key); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }

async function nextNum() {
  const meta = await get('meta','counter') || {key:'counter',val:0};
  meta.val++;
  await put('meta',meta);
  return String(meta.val).padStart(4,'0');
}

  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));

const fmtMoney = v => { const n=parseFloat(v); return isNaN(n)?'R$ 0,00':'R$ '+n.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.'); };
const fmtData  = d => d ? d.split('-').reverse().join('/') : '—';
const v = id => (document.getElementById(id)||{}).value||'';
const statusClass = {rascunho:'s-rascunho',enviado:'s-enviado',aprovado:'s-aprovado',recusado:'s-recusado'};

function toast(msg, ok=true) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show'+(ok?' ok':'');
  setTimeout(()=>t.className='toast',2500);
}

// ══ DASHBOARD ════════════════════════════════════════════════════════════════
async function loadDashboard() {
  const all_orcs = await all('orcamentos');
  // stats
  const total    = all_orcs.length;
  const aprovados= all_orcs.filter(o=>o.status==='aprovado').length;
  const enviados = all_orcs.filter(o=>o.status==='enviado').length;
  const valorTotal=all_orcs.filter(o=>o.status==='aprovado').reduce((s,o)=>s+(o.valor||0),0);
  document.getElementById('st-total').textContent=total;
  document.getElementById('st-aprov').textContent=aprovados;
  document.getElementById('st-env').textContent=enviados;
  document.getElementById('st-val').textContent=fmtMoney(valorTotal);
  // filter + search
  let orcs = all_orcs.sort((a,b)=>b.id-a.id);
  if (filtro!=='todos') orcs=orcs.filter(o=>o.status===filtro);
  if (busca) { const b=busca.toLowerCase(); orcs=orcs.filter(o=>(o.cliente||'').toLowerCase().includes(b)||(o.numero||'').includes(b)||(o.tipo_servico||'').toLowerCase().includes(b)); }
  const grid=document.getElementById('grid');
  if (!orcs.length) {
    grid.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><p>Nenhum orçamento encontrado.</p><button class="btn btn-primary" onclick="showPage('editor',{})">Criar primeiro orçamento</button></div>`;
    return;
  }
  grid.innerHTML = orcs.map(o=>`
    <div class="orc-card" id="card-${o.id}">
      <div class="orc-card-top">
        <span class="orc-num">Nº ${o.numero} · Proposta ${o.proposta||'01'}</span>
        <select class="status-badge status-select ${statusClass[o.status]||'s-rascunho'}" onchange="updateStatus(${o.id},this)" onclick="event.stopPropagation()">
          <option value="rascunho" ${o.status==='rascunho'?'selected':''}>Rascunho</option>
          <option value="enviado"  ${o.status==='enviado' ?'selected':''}>Enviado</option>
          <option value="aprovado" ${o.status==='aprovado'?'selected':''}>Aprovado</option>
          <option value="recusado" ${o.status==='recusado'?'selected':''}>Recusado</option>
        </select>
      </div>

// ══ PDF ══════════════════════════════════════════════════════════════════════
async function gerarPDF(docId){
  const btn=document.getElementById('btnPDF');
  const orig=btn?btn.innerHTML:'';
  if(btn){ btn.disabled=true; btn.innerHTML='<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg> Gerando...'; }
  const A4_W_MM=210,A4_H_MM=297,DOC_PX=794,SCALE=3;
  const MM_PER_PX=A4_W_MM/DOC_PX, A4_H_PX=A4_H_MM/MM_PER_PX;
  let container=null;
  try{
    const docEl=document.getElementById(docId);
    container=document.createElement('div');
    container.style.cssText=`position:fixed;left:-9999px;top:0;width:${DOC_PX}px;overflow:visible;background:#fff;z-index:-1;`;
    const clone=docEl.cloneNode(true);
    clone.style.cssText=`width:${DOC_PX}px;min-width:${DOC_PX}px;box-shadow:none;`;
    container.appendChild(clone); document.body.appendChild(container);
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const totalDocH=clone.scrollHeight;
    const cloneTop=clone.getBoundingClientRect().top;
    const sections=clone.querySelectorAll('.doc-cover,.doc-section');
    const breaks=[];
    sections.forEach(s=>{ const b=s.getBoundingClientRect().bottom-cloneTop; if(b>0&&b<totalDocH) breaks.push(b); });
    const canvas=await html2canvas(clone,{scale:SCALE,useCORS:true,allowTaint:true,backgroundColor:'#ffffff',logging:false,width:DOC_PX,windowWidth:DOC_PX});
    document.body.removeChild(container); container=null;
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const cuts=[0]; let cursor=0;
    while(cursor<totalDocH){ const hard=cursor+A4_H_PX; if(hard>=totalDocH) break; let best=-1; for(const bp of breaks) if(bp>cursor+20&&bp<=hard) best=bp; const cut=best>0?best:hard; cuts.push(cut); cursor=cut; }
    for(let i=0;i<cuts.length;i++){
      if(i>0) pdf.addPage();
      const startPx=cuts[i],endPx=i<cuts.length-1?cuts[i+1]:totalDocH;
      const contentH=endPx-startPx,srcY=Math.round(startPx*SCALE),srcH=Math.round(contentH*SCALE);
      const tmp=document.createElement('canvas'); tmp.width=canvas.width; tmp.height=Math.round(A4_H_PX*SCALE);
      const ctx=tmp.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,tmp.width,tmp.height);
      ctx.drawImage(canvas,0,srcY,canvas.width,srcH,0,0,canvas.width,srcH);
      pdf.addImage(tmp.toDataURL('image/jpeg',0.97),'JPEG',0,0,A4_W_MM,A4_H_MM);
    }
    const orc=viewOrc||(editingId?await get('orcamentos',editingId):null);
    const cliente=(orc?.cliente||'orcamento').replace(/\s+/g,'_');
    const num=(orc?.numero||'0001').padStart(4,'0');
    pdf.save(`Orcamento_${num}_${cliente}.pdf`);
  }catch(e){
    if(container?.parentNode) document.body.removeChild(container);
    alert('Erro: '+e.message);
  }
  if(btn){ btn.innerHTML=orig; btn.disabled=false; }
}
